name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\build.ps1

      - name: Selftest & HiDPI renders
        shell: pwsh
        run: |
          New-Item -ItemType Directory out\selftest -Force | Out-Null
          $p = Start-Process bin\Legram.exe -ArgumentList '--selftest', "$pwd\out\selftest" -PassThru -Wait -RedirectStandardOutput out\selftest.out -RedirectStandardError out\selftest.err
          Get-Content out\selftest.out, out\selftest.err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "--selftest failed with exit code $($p.ExitCode)" }

      - name: App log
        if: failure()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\Legram\legram.log" -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path bin\Legram.exe, bin\legram.ico, bin\fonts, bin\setup-task.ps1, bin\LICENSE, bin\THIRD_PARTY_NOTICES.md -DestinationPath "out\Legram-$v-win-x64.zip" -Force
          Get-FileHash "out\Legram-$v-win-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Legram-$v-win-x64.zip" } | Set-Content -Encoding ascii "out\Legram-$v-win-x64.zip.sha256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legram
          path: |
            out/*.zip
            out/*.sha256
            out/selftest/*.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/*.zip
            out/*.sha256
